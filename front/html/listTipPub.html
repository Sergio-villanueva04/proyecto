<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Redes Sociales</title>
    <link rel="stylesheet" href="./../style/css/bootstrap.min.css">
    <style>
        .table-trans {
            --bs-table-bg: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body style="background-image: url('./../img/fondo.jpg'); background-size: cover;">
    <div id="navbar"></div>
    <div class="container">
        <div class="row">
            <div class="col-12">
                <div class="row">
                    <div class="col-1"></div>
                    <div class="col-10">
                        <div class="row p-3 bg-primary align-items-center">
                            <div class="col-10">
                                <h2 class="text-white text-center">Tipos de Publicación</h2>
                            </div>
                            <div class="col-2">
                                <a href="addTipPub.html" class="btn" style="color: white; background: orange;">Agregar
                                    Tipo de Publicación</a>
                            </div>
                        </div>
                        <div class="row bg-primary">
                        </div>
                        <div class="row">
                            <div class="col-12 p-0">
                                <table class="table table-striped table-hover table-trans">
                                    <thead>
                                        <tr>
                                            <td class="text-white bg-primary text-center fw-bold fs-5">Nombre
                                            </td>
                                            <td class="text-white bg-primary text-center fw-bold fs-5">Estatus</td>
                                            <td class="text-white bg-primary text-center fw-bold fs-5">Acciones</td>
                                        </tr>
                                    </thead>
                                    <tbody>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="col-1"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="./../style/js/bootstrap.min.js"></script>
    <script>
        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = "login.html";
        }

        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = "login.html";
        } else if (currentUser.tipo !== 'admin') {
            window.location.href = "list.html";
        }

        let tipPub = JSON.parse(localStorage.getItem("tipPub"));


        fetch('navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar').innerHTML = data;

                let userString = localStorage.getItem('currentUser');

                if (userString) {
                    let currentUser = JSON.parse(userString);

                    if (currentUser.tipo === 'admin') {
                        let navContainer = document.querySelector('.navbar-nav');

                        if (navContainer) {
                            navContainer.innerHTML += `
                        <li class="nav-item">
                            <a class="nav-link" href="listRedSoc.html">Redes Sociales</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="listTipPub.html">Tipos de Publicaciones</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="listUser.html">Usuarios</a>
                        </li>
                    `;
                        }
                    }
                }
            })
            .catch(error => console.error('Error loading the navbar:', error));

        document.addEventListener('DOMContentLoaded', function () {
            const tableBody = document.querySelector('tbody');
            if (tipPub) {
                tableBody.innerHTML = '';
                tipPub.forEach(item => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="text-center">${item.nombre}</td>
                        <td class="text-center">${item.estatus}</td>
                        <td class="text-center">
                            <a href="addTipPub.html?id=${item.id}" class="btn btn-sm btn-primary">Editar</a>
                            <button onclick="updtTipPub(${item.id})" class="btn btn-sm btn-danger">${item.estatus === 'Inactivo' ? 'Activar' : 'Desactivar'}</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            }
        });

        function updtTipPub(id) {
            if (tipPub) {
                const tipPubIndex = tipPub.findIndex(item => item.id === id);
                if (tipPubIndex !== -1) {
                    tipPub[tipPubIndex].estatus = tipPub[tipPubIndex].estatus === 'Activo' ? 'Inactivo' : 'Activo';
                    localStorage.setItem("tipPub", JSON.stringify(tipPub));
                    location.reload();
                }
            }
        }
    </script>
</body>

</html>
